<body>
  <main class="window crt" id="window" aria-label="Terminal portfolio">
    <header class="titlebar" id="titlebar">
      <div class="dots">
        <button class="dot red" id="btn-close" title="Shut down" aria-label="Shut down"></button>
        <button class="dot yellow" id="btn-min" title="Minimize" aria-label="Minimize"></button>
        <button class="dot green" id="btn-max" title="Toggle fullscreen" aria-label="Toggle fullscreen"></button>
      </div>
      <div class="title" id="title">guest@portfolio: ~</div>
      <div class="title-actions">
        <button class="ghost-btn" id="btn-gui" data-run="gui" title="Open the classic résumé view">GUI</button>
      </div>
    </header>
    <div class="body" id="body">
      <div class="screen" id="screen" role="log" aria-live="polite">
        <div id="output"></div>
      </div>
      <div class="crt-overlay" aria-hidden="true"></div>
    </div>
    <!-- filled from quickCommands in site.config.js -->
    <nav class="quickbar" id="quickbar" aria-label="Quick commands"></nav>
  </main>

  <button class="dock-icon" id="dock" hidden aria-label="Restore terminal">&gt;_</button>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="gui" id="gui" hidden></div>
